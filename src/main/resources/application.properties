# ?????????????????????????????????????????????
# Application
# ?????????????????????????????????????????????
spring.application.name=smart-opd-connect
server.port=8080
spring.profiles.active=local


# ?????????????????????????????????????????????
# MySQL Database
# ?????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/smart_opd
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ?????????????????????????????????????????????
# JPA / Hibernate
# ?????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ?????????????????????????????????????????????
# JWT
# ?????????????????????????????????????????????
jwt.secret=SmartOPDConnectSecretKey2024SuperSecureKeyForJWT
jwt.expiration-ms=86400000


# ?????????????????????????????????????????????
# Spring AI - Google Gemini
# ?????????????????????????????????????????????
# Get your API key from Google AI Studio:
# https://aistudio.google.com/app/apikey
#
# IMPORTANT:
# Set GOOGLE_API_KEY as an environment variable.
spring.ai.google.genai.api-key=${GCP_API_KEY}

spring.ai.google.genai.chat.options.model=gemini-3.6-flash
#spring.ai.google.genai.chat.temperature=0.4


# ?????????????????????????????????????????????
# Smart OPD AI
# ?????????????????????????????????????????????
smart-opd.ai.enabled=true


# ?????????????????????????????????????????????
# Logging
# ?????????????????????????????????????????????
logging.level.com.opd_system=INFO
logging.level.org.springframework.security=WARN