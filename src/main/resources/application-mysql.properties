# Activate with SPRING_PROFILES_ACTIVE=mysql. Supply values through environment variables.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/smart_opd}
spring.datasource.username=${MYSQL_USERNAME:smart_opd}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
